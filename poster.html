<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>주신당 출퇴근 QR 포스터 (A4 인쇄용)</title>
  <!--
    매장 입구 부착용 A4 포스터.
    사용법: 이 파일을 브라우저로 열고 Ctrl+P → A4 세로, 여백 "기본" 또는 "없음"으로 인쇄.
    QR은 파일 안에 내장돼 있어(고정 배포 URL) 이 파일 하나로 완결됨.
  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --ink: #1c1a17;
      --muted: #8a8275;
      --bg: #f4f1ea;
      --card: #fffdf8;
      --line: #e6e0d3;
      --accent: #e2761b;
      --go: #2f8f5b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #777; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--ink); }

    /* A4 = 210mm x 297mm */
    .sheet {
      width: 210mm; min-height: 297mm; margin: 10mm auto;
      background: var(--bg);
      padding: 16mm 16mm 12mm;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 6px 30px rgba(0,0,0,.35);
    }

    .brand { font-size: 13pt; font-weight: 800; letter-spacing: .35em; color: var(--accent); margin-bottom: 4mm; }
    h1 { font-size: 34pt; font-weight: 800; letter-spacing: -.02em; text-align: center; line-height: 1.25; }
    h1 small { display: block; font-size: 13pt; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin-top: 3mm; }

    .qr-card {
      background: var(--card); border: 1.5pt solid var(--line); border-radius: 8mm;
      padding: 9mm; margin: 10mm 0 8mm;
      box-shadow: 0 3mm 10mm rgba(40,30,15,.10);
    }
    .qr-card img { display: block; width: 105mm; height: 105mm; image-rendering: pixelated; }

    .scan-hint { font-size: 14pt; font-weight: 800; color: var(--accent); margin-bottom: 9mm; }

    .steps { width: 100%; display: flex; gap: 5mm; }
    .step {
      flex: 1; background: var(--card); border: 1pt solid var(--line); border-radius: 5mm;
      padding: 6mm 4mm; text-align: center;
    }
    .step .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 8mm; height: 8mm; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 11pt; font-weight: 800; margin-bottom: 3mm;
    }
    .step:last-child .num { background: var(--go); }
    .step .emo { display: block; font-size: 17pt; margin-bottom: 2mm; }
    .step b { display: block; font-size: 13pt; font-weight: 800; letter-spacing: -.01em; }
    .step span { display: block; font-size: 9.5pt; color: var(--muted); margin-top: 1.5mm; line-height: 1.4; }

    .foot {
      margin-top: auto; padding-top: 8mm; width: 100%;
      text-align: center; font-size: 10pt; color: var(--muted); line-height: 1.7;
    }
    .foot b { color: var(--ink); }

    @page { size: A4 portrait; margin: 0; }
    @media print {
      html, body { background: #fff; }
      .sheet { margin: 0; box-shadow: none; width: 210mm; height: 297mm; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="brand">JUSINDANG</div>
    <h1>출퇴근은 여기서 찰칵!<small>주신당 강남점 · 근태 기록</small></h1>

    </div>
    <div class="scan-hint">📱 폰 카메라를 QR에 갖다 대세요</div>

    <div class="steps">
      <div class="step">
        <span class="num">1</span>
        <span class="emo">📷</span>
        <b>QR 스캔</b>
        <span>카메라를 켜고<br>QR을 비추면 끝</span>
      </div>
      <div class="step">
        <span class="num">2</span>
        <span class="emo">👆</span>
        <b>내 이름 톡</b>
        <span>한 번 고르면<br>다음부턴 건너뛰어요</span>
      </div>
      <div class="step">
        <span class="num">3</span>
        <span class="emo">✅</span>
        <b>초록 버튼 톡</b>
        <span>출근·퇴근은<br>자동으로 판단해요</span>
      </div>
    </div>

    <div class="foot">
      <b>매장 와이파이</b>에 연결돼 있어야 기록돼요 · 와이파이가 늦게 붙으면 몇 초만 기다려 주세요<br>
      기록되면 <b>내 슬랙으로 바로 알림</b>이 가요 · 문의는 관리자에게
    </div>
  </div>
